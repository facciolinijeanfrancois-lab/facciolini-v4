<script>
// ===== CONSTANTES =====
const MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MOIS_S=['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
const MOI={nom:'Jean-François Facciolini',activite:'Facciolini Mobility',adresse:'Rue Saint-Eloi 173, 7141 Carnières',bce:'1033.793.336',email:'facciolini.mobility@outlook.com',tel:'0471692650'};
const HOME_DEFAULT={adresse:'Rue Saint-Eloi 173, 7141 Carnières',lat:50.4089,lon:4.1756};
const CHARGES_DEFAULT=[
  {id:'ch-compta',nom:'AG Compta Fisc (Adam)',montant:50.00},
  {id:'ch-proximus',nom:'Proximus Pro',montant:62.84},
  {id:'ch-assurance',nom:'Assurance TL Seat Leon',montant:333.00},
  {id:'ch-credit',nom:'Crédit Seat Leon',montant:339.11},
  {id:'ch-inasti',nom:'Lois sociales INASTI',montant:38.33}
];
const FAV_DEFAULT=[
  {id:'fav-zav',nom:'Zaventem BRU',adresse:'Brussels Airport, Zaventem',lat:50.9010,lon:4.4844},
  {id:'fav-crl',nom:'Charleroi CRL',adresse:'Brussels South Charleroi Airport',lat:50.4592,lon:4.4538},
  {id:'fav-mons',nom:'Gare de Mons',adresse:'Rue de la Station, Mons',lat:50.4542,lon:3.9563},
  {id:'fav-chl',nom:'Gare Charleroi',adresse:'Boulevard Tirou, Charleroi',lat:50.4108,lon:4.4446},
  {id:'fav-midi',nom:'Gare du Midi',adresse:'Rue de France 2, Bruxelles',lat:50.8354,lon:4.3360}
];
const ENTRETIEN_DEFAULT=[
  {id:'ent-vidange',type:'Vidange moteur',kmLast:0,intervalle:15000,date:'',notes:'Seat Leon 2.0 TDI — huile 5W30'},
  {id:'ent-ct',type:'Contrôle technique TL',kmLast:0,intervalle:0,date:'2026-12-01',notes:'Renouvellement annuel plaque TL'},
  {id:'ent-pneus',type:'Pneus',kmLast:0,intervalle:40000,date:'',notes:'Vérifier usure tous les 20.000km'},
  {id:'ent-freins',type:'Plaquettes freins',kmLast:0,intervalle:50000,date:'',notes:'Avant et arrière'},
  {id:'ent-clim',type:'Recharge climatisation',kmLast:0,intervalle:0,date:'2027-06-01',notes:'Tous les 2-3 ans'}
];
const PARTNERS_DEFAULT_DATA=[
  {id:'p-sandro',nom:'Taxi Sandro',email:'',tel:'',adresse:'',tva:''},
  {id:'p-allnav',nom:'All Navettes',email:'',tel:'',adresse:'',tva:''},
  {id:'p-binche',nom:'Taxi Binche',email:'',tel:'',adresse:'',tva:''},
  {id:'p-volovia',nom:'Navette Volovia',email:'',tel:'',adresse:'',tva:''}
];

// ===== BASE DE DONNÉES =====
let db={
  reservations:[],clients:[],carburant:[],charges:[],kmReels:[],frais:[],entretien:[],favAddresses:[],partners:[],
  settings:{
    pin:null,objectif:2000,homeAddress:HOME_DEFAULT,
    vehicles:[{nom:'Seat Leon',cout:0.30,conso:5.0},{nom:'Talento',cout:0.45,conso:8.0}],
    tarifs:{rayon:30,court:1.40,long:1.50,min:50,round:5,camion:20},
    vip:{seuil:4,reduc:10}
  }
};
let curMonth=new Date().getMonth(),curYear=new Date().getFullYear();
let curStep=1,resFilter='tous';
let acTimers={},acCoords={};

// ===== STORAGE =====
function save(){
  try{localStorage.setItem('facciolini_v52',JSON.stringify(db));}
  catch(e){alert('Erreur sauvegarde: '+e.message);}
}

function load(){
  // v5.2
  let d=localStorage.getItem('facciolini_v52');
  if(!d)d=localStorage.getItem('facciolini_v51');
  if(!d)d=localStorage.getItem('facciolini_v5');
  if(d){try{const p=JSON.parse(d);db={...db,...p};fixDb();return;}catch(e){}}
  // Migration v4
  const d4=localStorage.getItem('facciolini_v4');
  if(d4){try{
    const old=JSON.parse(d4);
    db.reservations=(old.reservations||[]).map(r=>migrateRes(r));
    db.carburant=old.carburant||[];
    db.charges=(old.charges||[]).map(c=>{
      if(c.nom&&c.nom.toLowerCase().includes('comptable')&&parseFloat(c.montant)>50)return{...c,montant:50};
      return c;
    });
    db.kmReels=old.kmReels||[];
    if(old.settings)db.settings={...db.settings,...old.settings};
    fixDb();save();return;
  }catch(e){}}
  fixDb();
}

function migrateRes(r){
  return{
    distanceRetour:0,departRetour:'',arriveeRetour:'',
    depRetLat:null,depRetLon:null,arrRetLat:null,arrRetLon:null,
    kmPickup:0,kmPickupRetour:0,
    kmVideAller:0,kmVideAllerType:'maison',
    kmVideRetour:0,kmVideRetourType:'maison',
    langue:'fr',vehicule:0,
    facturePaye:false,commissionPayee:false,
    ...r
  };
}

function fixDb(){
  if(!db.frais)db.frais=[];
  if(!db.entretien||!db.entretien.length)db.entretien=JSON.parse(JSON.stringify(ENTRETIEN_DEFAULT));
  if(!db.favAddresses||!db.favAddresses.length)db.favAddresses=JSON.parse(JSON.stringify(FAV_DEFAULT));
  if(!db.partners||!db.partners.length)db.partners=JSON.parse(JSON.stringify(PARTNERS_DEFAULT_DATA));
  if(!db.kmReels)db.kmReels=[];
  if(!db.clients)db.clients=[];
  if(!db.settings.homeAddress||!db.settings.homeAddress.lat)db.settings.homeAddress=HOME_DEFAULT;
  if(!db.settings.tarifs.round)db.settings.tarifs.round=5;
  if(!db.settings.tarifs.camion)db.settings.tarifs.camion=20;
  if(!db.settings.tarifs.min)db.settings.tarifs.min=50;
  if(!db.charges||!db.charges.length)db.charges=JSON.parse(JSON.stringify(CHARGES_DEFAULT));
  db.reservations=db.reservations.map(r=>migrateRes(r));
}

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmt(n){return parseFloat(n||0).toFixed(2).replace('.',',')+' €';}
function fmtKm(n){const v=parseFloat(n||0);return v.toFixed(1).replace('.',',')+' km';}
function roundTo(n,r){r=r||5;return Math.round(n/r)*r;}

// ===== CALCULS KM — DEUX FONCTIONS SÉPARÉES =====

// Km facturables client (pour prix)
function getKmClient(r){
  let km=parseFloat(r.distance||0);
  if(r.type==='ar-jour')km+=parseFloat(r.distanceRetour||r.distance||0);
  else if(r.type==='ar-diff')km+=parseFloat(r.distanceRetour||r.distance||0);
  return km;
}

// Km réels totaux (pour suivi compteur et coût réel)
function getKmReels(r){
  let km=0;
  km+=parseFloat(r.kmPickup||0);
  km+=parseFloat(r.distance||0);
  km+=parseFloat(r.kmVideAller||0);
  if(r.type==='ar-jour'){
    km+=parseFloat(r.distanceRetour||r.distance||0);
    km+=parseFloat(r.kmVideRetour||0);
  }else if(r.type==='ar-diff'){
    km+=parseFloat(r.kmPickupRetour||0);
    km+=parseFloat(r.distanceRetour||r.distance||0);
    km+=parseFloat(r.kmVideRetour||0);
  }
  return km;
}

function getBenef(r){
  const v=getV(r.vehicule);
  return parseFloat(r.prix||0)-getKmClient(r)*v.cout-parseFloat(r.peages||0)-parseFloat(r.parking||0)-parseFloat(r.commission||0);
}

function getBenefReel(r){
  const v=getV(r.vehicule);
  return parseFloat(r.prix||0)-getKmReels(r)*v.cout-parseFloat(r.peages||0)-parseFloat(r.parking||0)-parseFloat(r.commission||0);
}

function getV(idx){return db.settings.vehicles[parseInt(idx||0)]||db.settings.vehicles[0];}
function getMonthRes(m,y){return db.reservations.filter(r=>{const da=new Date(r.dateAller);if(da.getMonth()===m&&da.getFullYear()===y)return true;if(r.type==='ar-diff'&&r.dateRetour){const dr=new Date(r.dateRetour);if(dr.getMonth()===m&&dr.getFullYear()===y)return true;}return false;});}
function getMonthCarb(m,y){return db.carburant.filter(c=>{const d=new Date(c.date);return d.getMonth()===m&&d.getFullYear()===y;});}
function getMonthFrais(m,y){return db.frais.filter(f=>{const d=new Date(f.date);return d.getMonth()===m&&d.getFullYear()===y;});}
function getYearKm(y){return db.reservations.filter(r=>new Date(r.dateAller).getFullYear()===y).reduce((s,r)=>s+getKmClient(r),0);}
function getKmReelsMois(m,y){const ms=y+'-'+String(m+1).padStart(2,'0');const e=db.kmReels.find(k=>k.mois===ms);if(!e||!e.debut||!e.fin)return null;return parseFloat(e.fin)-parseFloat(e.debut);}
function getEncaisseAller(r){const p=parseFloat(r.prix||0),a=parseFloat(r.acompte||0);if(r.type==='aller'||r.type==='ar-jour')return p;return a>0?a:Math.round(p/2*100)/100;}
function getEncaisseRetour(r){const p=parseFloat(r.prix||0),a=parseFloat(r.acompte||0);if(r.type==='aller'||r.type==='ar-jour')return 0;return a>0?Math.round((p-a)*100)/100:Math.round(p/2*100)/100;}
function getEncaisseMois(m,y){return db.reservations.reduce((s,r)=>{const da=new Date(r.dateAller);const dr=r.type==='ar-diff'&&r.dateRetour?new Date(r.dateRetour):null;let enc=0;if(da.getMonth()===m&&da.getFullYear()===y)enc+=getEncaisseAller(r);if(dr&&dr.getMonth()===m&&dr.getFullYear()===y)enc+=getEncaisseRetour(r);return s+enc;},0);}
function isVip(nom){return db.reservations.filter(r=>r.clientNom===nom).length>=db.settings.vip.seuil;}
function cntRes(nom){return db.reservations.filter(r=>r.clientNom===nom).length;}
function calcPartnerSoldes(){
  const s={};
  db.partners.forEach(p=>{s[p.nom]={commissionsDues:0,aFacturer:0,courses:[]};});
  db.reservations.forEach(r=>{
    if(!r.source||r.source==='direct')return;
    if(!s[r.source])s[r.source]={commissionsDues:0,aFacturer:0,courses:[]};
    if(r.partnerType==='commission'&&!r.commissionPayee)s[r.source].commissionsDues+=parseFloat(r.commission||0);
    else if(r.partnerType==='prepaye'&&!r.facturePaye)s[r.source].aFacturer+=parseFloat(r.prix||0);
    s[r.source].courses.push(r);
  });
  return s;
}
function getInastiAlerte(){
  const now=new Date();const y=now.getFullYear();
  const echeances=[{label:'T1',mois:3,jour:31},{label:'T2',mois:6,jour:31},{label:'T3',mois:9,jour:31},{label:'T4',mois:12,jour:31}];
  for(const e of echeances){
    const d=new Date(y,e.mois-1,e.jour);
    const diff=Math.round((d-now)/86400000);
    if(diff>=0&&diff<=45)return{label:e.label,date:d.toLocaleDateString('fr-BE',{day:'2-digit',month:'long'}),diff};
  }
  return null;
}

// ===== PIN =====
let pinBuf='';
function pp(v){if(v==='C'){pinBuf='';updDots();return;}if(v==='D'){pinBuf=pinBuf.slice(0,-1);updDots();return;}if(pinBuf.length>=4)return;pinBuf+=v;updDots();if(pinBuf.length===4)setTimeout(checkPin,120);}
function updDots(){for(let i=0;i<4;i++)document.getElementById('pd'+i).classList.toggle('filled',i<pinBuf.length);}
function checkPin(){if(!db.settings.pin){unlockApp();return;}if(pinBuf===db.settings.pin)unlockApp();else{document.getElementById('pin-err').textContent='PIN incorrect';pinBuf='';updDots();setTimeout(()=>document.getElementById('pin-err').textContent='',2000);}}
function unlockApp(){document.getElementById('pin-screen').style.display='none';document.getElementById('app').style.display='block';renderAll();}

// ===== NAVIGATION =====
function showPage(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  if(btn)btn.classList.add('active');
  renderAll();
}
function changeMonth(d){curMonth+=d;if(curMonth>11){curMonth=0;curYear++;}if(curMonth<0){curMonth=11;curYear--;}renderAll();}
function renderAll(){
  const now=new Date();
  document.getElementById('tb-date').textContent=now.toLocaleDateString('fr-BE',{day:'2-digit',month:'short'});
  document.getElementById('tb-month').textContent=MOIS_S[curMonth]+' '+curYear;
  renderDash();renderRes();renderFin();renderClients();renderPartners();renderParams();
}

// ===== DASHBOARD =====
function renderDash(){
  document.getElementById('dash-month').textContent=MOIS[curMonth]+' '+curYear;
  const res=getMonthRes(curMonth,curYear);
  const carbs=getMonthCarb(curMonth,curYear);
  const frais=getMonthFrais(curMonth,curYear);
  const recettes=res.reduce((s,r)=>s+parseFloat(r.prix||0),0);
  const totalKmClient=res.reduce((s,r)=>s+getKmClient(r),0);
  const totalKmReels=res.reduce((s,r)=>s+getKmReels(r),0);
  const charges=db.charges.reduce((s,c)=>s+parseFloat(c.montant||0),0);
  const diesel=carbs.reduce((s,c)=>s+parseFloat(c.prix||0),0);
  const fraisTotal=frais.reduce((s,f)=>s+parseFloat(f.montant||0),0);
  const commissions=res.reduce((s,r)=>s+parseFloat(r.commission||0),0);
  const benef=res.reduce((s,r)=>s+getBenef(r),0)-charges-diesel-fraisTotal;
  const marge=recettes>0?Math.round(benef/recettes*100):0;
  const encaisseMois=getEncaisseMois(curMonth,curYear);
  const obj=db.settings.objectif;
  const pct=Math.min(100,Math.round(encaisseMois/obj*100));
  const kmReel=getKmReelsMois(curMonth,curYear);

  document.getElementById('d-gains').textContent=fmt(encaisseMois);
  document.getElementById('d-obj-target').textContent=obj;
  document.getElementById('d-obj-prog').style.width=pct+'%';
  document.getElementById('d-obj-txt').textContent=encaisseMois>=obj?'🎉 Objectif atteint !':'Il reste '+fmt(obj-encaisseMois)+' — '+pct+'%';
  document.getElementById('d-benef').textContent=fmt(benef);
  document.getElementById('d-benef').className='stat-val '+(benef>=0?'c-green':'c-red');
  document.getElementById('d-marge').textContent='Marge '+marge+'%';
  document.getElementById('d-nb-res').textContent=res.length;
  document.getElementById('d-nb-sub').textContent=res.length+' course'+(res.length>1?'s':'');
  document.getElementById('d-km').textContent=fmtKm(totalKmClient);
  document.getElementById('d-km-reel').textContent=kmReel!==null?Math.round(kmReel)+' km':(totalKmReels>0?'~'+Math.round(totalKmReels)+' km':'—');
  document.getElementById('d-diesel').textContent=fmt(diesel);
  document.getElementById('d-litres').textContent=carbs.reduce((s,c)=>s+parseFloat(c.litres||0),0).toFixed(1)+' L';
  document.getElementById('d-charges').textContent=fmt(charges);
  document.getElementById('d-frais').textContent=fmt(fraisTotal);

  const alerts=[];
  const today2=new Date();
  const todayRes=db.reservations.filter(r=>new Date(r.dateAller).toDateString()===today2.toDateString());
  if(todayRes.length>0){
    const todayGains=todayRes.reduce((s,r)=>s+parseFloat(r.prix||0),0);
    alerts.push(`<div class="alert alert-green" style="flex-direction:column;align-items:stretch"><div style="font-weight:700;margin-bottom:4px">📅 Aujourd'hui : ${todayRes.length} course${todayRes.length>1?'s':''} · ${fmt(todayGains)}</div>${todayRes.sort((a,b)=>(a.heure||'').localeCompare(b.heure||'')).map(r=>`<div style="padding:5px 0;border-top:1px solid rgba(255,255,255,0.07);font-size:0.8rem">→ <b>${r.heure||'?'}</b> · ${r.clientNom||'Client'} · <span style="color:var(--green2)">${fmt(r.prix)}</span>${r.clientTel?` <a href="tel:${r.clientTel}" style="color:var(--blue2)">📞</a>`:''}</div>`).join('')}</div>`);
  }
  const vmts=db.reservations.filter(r=>r.paiement==='virement'&&!r.vmtRecu);
  if(vmts.length)alerts.push(`<div class="alert alert-red">🏦 ${vmts.length} virement${vmts.length>1?'s':''} en attente !</div>`);
  if(kmReel===null)alerts.push(`<div class="alert alert-blue" style="cursor:pointer" onclick="openKmModal()">📍 Relevé compteur non saisi pour ${MOIS[curMonth]} — Cliquez ici</div>`);
  const inasti=getInastiAlerte();
  if(inasti)alerts.push(`<div class="alert" style="background:rgba(124,58,237,0.07);border:1px solid rgba(124,58,237,0.2);color:var(--purple2)">💼 INASTI ${inasti.label} — Cotisation due avant le ${inasti.date} (dans ${inasti.diff}j)</div>`);
  db.entretien.filter(e=>e.date&&(new Date(e.date)-today2)/86400000<30&&(new Date(e.date)-today2)/86400000>=0).forEach(e=>alerts.push(`<div class="alert alert-red">🔧 ${e.type} à prévoir avant le ${new Date(e.date).toLocaleDateString('fr-BE')} !</div>`));
  const sousCoût=res.filter(r=>getBenef(r)<0);
  if(sousCoût.length)alerts.push(`<div class="alert alert-red">⚠️ ${sousCoût.length} course${sousCoût.length>1?'s':''} avec bénéfice négatif !</div>`);
  document.getElementById('d-alerts').innerHTML=alerts.join('');

  const bars=[];
  for(let i=5;i>=0;i--){let m=curMonth-i,y=curYear;if(m<0){m+=12;y--;}const g=getEncaisseMois(m,y);bars.push({m:MOIS_S[m],g,cur:i===0});}
  const maxG=Math.max(...bars.map(b=>b.g),1);
  const totalChart=bars.reduce((s,b)=>s+b.g,0);
  document.getElementById('d-chart-total').textContent='Total: '+fmt(totalChart);
  document.getElementById('d-chart').innerHTML=bars.map(b=>`<div class="cbar-wrap">${b.g>0?`<div class="cbar-val">${Math.round(b.g)}€</div>`:'<div class="cbar-val" style="opacity:0">0</div>'}<div class="cbar ${b.cur?'cur':''} ${b.g>0?'has-data':''}" style="height:${Math.max(b.g>0?8:3,b.g/maxG*92)}px"></div><div class="cbar-label">${b.m}</div></div>`).join('');

  const cs={};res.forEach(r=>{const k=r.clientNom||'?';if(!cs[k])cs[k]={g:0,n:0};cs[k].g+=parseFloat(r.prix||0);cs[k].n++;});
  const top=Object.entries(cs).sort((a,b)=>b[1].g-a[1].g).slice(0,3);
  document.getElementById('d-top').innerHTML=top.length?top.map(([nom,s],i)=>`<div class="dr"><span class="dr-label">${['🥇','🥈','🥉'][i]} ${nom}${isVip(nom)?' ⭐':''}</span><span class="dr-val">${fmt(s.g)} · ${s.n} course${s.n>1?'s':''}</span></div>`).join(''):'<div style="color:var(--text3);font-size:0.82rem;padding:8px 0">Aucune course ce mois</div>';

  const inaEl=document.getElementById('d-inasti');
  if(inasti){inaEl.innerHTML=`<div class="inasti-box"><div style="font-size:0.65rem;color:var(--purple2);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px">💼 INASTI ${inasti.label}</div><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:700;color:var(--text)">~115,00 €</div><div style="font-size:0.73rem;color:var(--text3)">Due avant le ${inasti.date}</div></div><span style="font-weight:700;color:var(--purple2)">Dans ${inasti.diff}j</span></div></div>`;}
  else if(inaEl)inaEl.innerHTML='';

  const soldes=calcPartnerSoldes();
  const hasAct=db.partners.some(p=>soldes[p.nom]&&(soldes[p.nom].commissionsDues>0||soldes[p.nom].aFacturer>0));
  const psEl=document.getElementById('d-partner-soldes');
  if(hasAct){psEl.innerHTML=`<div class="card"><div style="font-size:0.65rem;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">🤝 Soldes partenaires</div>${db.partners.map(p=>{const s=soldes[p.nom]||{commissionsDues:0,aFacturer:0};if(!s.commissionsDues&&!s.aFacturer)return'';return`<div class="dr"><span class="dr-label">${p.nom}</span><div style="text-align:right">${s.commissionsDues>0?`<div style="font-size:0.73rem;color:var(--red2);font-weight:600">À reverser : ${fmt(s.commissionsDues)}</div>`:''} ${s.aFacturer>0?`<div style="font-size:0.73rem;color:var(--green2);font-weight:600">À facturer : ${fmt(s.aFacturer)}</div>`:''}</div></div>`;}).join('')}</div>`;}
  else if(psEl)psEl.innerHTML='';

  document.getElementById('d-virements').innerHTML=vmts.length?`<div class="card"><div style="font-size:0.65rem;color:var(--red2);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">Virements en attente</div>${vmts.map(r=>`<div class="dr"><span class="dr-label">${r.clientNom||'Client'} · ${new Date(r.dateAller).toLocaleDateString('fr-BE',{day:'2-digit',month:'short'})}</span><div style="display:flex;align-items:center;gap:8px"><span class="dr-val c-gold">${fmt(r.prix)}</span><button class="btn btn-green btn-xs" onclick="markVmt('${r.id}')">✓ Reçu</button></div></div>`).join('')}</div>`:'';

  const now2=new Date();now2.setHours(0,0,0,0);
  const soldesAV=db.reservations.filter(r=>{if(r.type!=='ar-diff'||!r.dateRetour)return false;const dr=new Date(r.dateRetour);dr.setHours(0,0,0,0);return dr>=now2&&getEncaisseRetour(r)>0;}).sort((a,b)=>new Date(a.dateRetour)-new Date(b.dateRetour)).slice(0,4);
  const soldesEl=document.getElementById('d-soldes');
  if(soldesAV.length){const tot=soldesAV.reduce((s,r)=>s+getEncaisseRetour(r),0);soldesEl.innerHTML=`<div class="card card-gold"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span style="font-size:0.65rem;color:var(--gold2);font-weight:700;text-transform:uppercase;letter-spacing:0.08em">💰 Soldes à encaisser</span><span style="font-weight:700;color:var(--gold);font-family:'Playfair Display',serif">${fmt(tot)}</span></div>${soldesAV.map(r=>{const dr=new Date(r.dateRetour);dr.setHours(0,0,0,0);const diff=Math.round((dr-now2)/86400000);const ds=diff===0?'<span style="color:var(--gold);font-weight:700">Aujourd\'hui</span>':diff===1?'<span style="color:var(--orange2)">Demain</span>':`Dans ${diff}j`;return`<div class="dr"><span class="dr-label">${ds} · ${r.clientNom||'Client'}</span><span class="dr-val c-gold">${fmt(getEncaisseRetour(r))}</span></div>`;}).join('')}</div>`;}
  else if(soldesEl)soldesEl.innerHTML='';
}

      <div style="font-size:0.79rem;color:var(--text2);margin-bottom:6px">${(r.depart||'—').substring(0,26)} → ${(r.arrivee||'—').substring(0,26)}</div>
      ${r.type==='ar-diff'&&r.arriveeRetour?`<div style="font-size:0.75rem;color:var(--text3);margin-bottom:8px">↩ ${(r.departRetour||r.arrivee||'—').substring(0,22)} → ${r.arriveeRetour.substring(0,22)}</div>`:''}
      <div style="display:flex;flex-wrap:wrap;gap:5px">

// ===== FINANCES =====
function renderFin(){
  document.getElementById('fin-month').textContent=MOIS[curMonth]+' '+curYear;
  const res=getMonthRes(curMonth,curYear);
  const carbs=getMonthCarb(curMonth,curYear);
  const frais=getMonthFrais(curMonth,curYear);
  const recettes=res.reduce((s,r)=>s+parseFloat(r.prix||0),0);
  const encaisse=getEncaisseMois(curMonth,curYear);
  const totalKmClient=res.reduce((s,r)=>s+getKmClient(r),0);
  const totalKmReels=res.reduce((s,r)=>s+getKmReels(r),0);
  const charges=db.charges.reduce((s,c)=>s+parseFloat(c.montant||0),0);
  const diesel=carbs.reduce((s,c)=>s+parseFloat(c.prix||0),0);
  const fraisTotal=frais.reduce((s,f)=>s+parseFloat(f.montant||0),0);
  const peages=res.reduce((s,r)=>s+parseFloat(r.peages||0)+parseFloat(r.parking||0),0);
  const commissions=res.reduce((s,r)=>s+parseFloat(r.commission||0),0);
  const benef=res.reduce((s,r)=>s+getBenef(r),0)-charges-diesel-fraisTotal;
  const benefReel=res.reduce((s,r)=>s+getBenefReel(r),0)-charges-diesel-fraisTotal;
  const kmReel=getKmReelsMois(curMonth,curYear);
  const moisStr=curYear+'-'+String(curMonth+1).padStart(2,'0');
  const kmEntry=db.kmReels.find(k=>k.mois===moisStr);

  document.getElementById('km-debut-display').textContent=kmEntry?.debut?kmEntry.debut+' km':'—';
  document.getElementById('km-fin-display').textContent=kmEntry?.fin?kmEntry.fin+' km':'—';
  document.getElementById('km-reel-display').textContent=kmReel!==null?Math.round(kmReel)+' km':'—';
  const kmRef=kmReel||totalKmReels;
  document.getElementById('km-taux-display').textContent=kmRef>0?Math.round(totalKmClient/kmRef*100)+'%'+(kmReel?'':' (est.)':'—'):'—';
  document.getElementById('f-recettes').textContent=fmt(recettes);
  document.getElementById('f-encaisse-sub').textContent='Encaissé: '+fmt(encaisse);
  document.getElementById('f-benef').textContent=fmt(benef);
  document.getElementById('f-benef').className='stat-val '+(benef>=0?'c-green':'c-red');
  document.getElementById('f-benef-reel-sub').textContent='Réel: '+fmt(benefReel);
  document.getElementById('f-diesel').textContent=fmt(diesel);
  document.getElementById('f-commissions').textContent=fmt(commissions);
  document.getElementById('f-frais-stat').textContent=fmt(fraisTotal);
  document.getElementById('f-peages').textContent=fmt(peages);

  let coutReelKm='—',coutReelSub='—';
  if(kmRef>0){const cr=(diesel+charges+fraisTotal)/kmRef;coutReelKm=cr.toFixed(3).replace('.',',')+' €/km';coutReelSub=kmReel?'sur '+Math.round(kmRef)+' km réels':'estimé';}
  else{
    let totKm=0,totD=0,totF=0,mAvec=0;
    for(let i=1;i<=3;i++){let m=curMonth-i,y=curYear;if(m<0){m+=12;y--;}const kmM=getKmReelsMois(m,y);const dM=getMonthCarb(m,y).reduce((s,c)=>s+parseFloat(c.prix||0),0);const fM=getMonthFrais(m,y).reduce((s,f)=>s+parseFloat(f.montant||0),0);if(kmM&&kmM>0){totKm+=kmM;totD+=dM;totF+=fM;mAvec++;}}
    if(mAvec>0&&totKm>0){const kmMoy=totKm/mAvec;const cr=(totD/mAvec+charges+totF/mAvec)/kmMoy;coutReelKm=cr.toFixed(3).replace('.',',')+' €/km';coutReelSub='moy. '+mAvec+' mois';}
  }
  document.getElementById('f-cout-reel').textContent=coutReelKm;
  document.getElementById('f-cout-sub').textContent=coutReelSub;

  const kmVide=totalKmReels-totalKmClient;
  document.getElementById('f-km-c').textContent=fmtKm(totalKmClient);
  document.getElementById('f-km-reel').textContent=kmReel!==null?Math.round(kmReel)+' km':(totalKmReels>0?'~'+Math.round(totalKmReels)+' km':'—');
  document.getElementById('f-km-vide').textContent=totalKmReels>0?fmtKm(kmVide):'—';
  document.getElementById('f-taux-charge').textContent=totalKmReels>0?Math.round(totalKmClient/totalKmReels*100)+'%':'—';
  document.getElementById('f-km-a').textContent=fmtKm(getYearKm(curYear));

  const litres=carbs.reduce((s,c)=>s+parseFloat(c.litres||0),0);
  document.getElementById('f-carb-dep').textContent=fmt(diesel);
  document.getElementById('f-carb-lit').textContent=litres.toFixed(1)+' L';
  document.getElementById('f-carb-px').textContent=litres>0?(diesel/litres).toFixed(3).replace('.',',')+' €/L':'—';
  const carbsAvecKm=[...db.carburant].filter(c=>c.km).sort((a,b)=>parseFloat(a.km)-parseFloat(b.km));
  let consoText='—';
  if(carbsAvecKm.length>=2){const last=carbsAvecKm[carbsAvecKm.length-1];const prev=carbsAvecKm[carbsAvecKm.length-2];const kmE=parseFloat(last.km)-parseFloat(prev.km);const litE=parseFloat(last.litres||0);if(kmE>0&&litE>0)consoText=(litE/kmE*100).toFixed(1).replace('.',',')+' L/100km';}
  document.getElementById('f-carb-co').textContent=consoText;

  const carbSorted=[...carbs].sort((a,b)=>new Date(b.date)-new Date(a.date));
  document.getElementById('carb-list').innerHTML=carbSorted.length?carbSorted.map(c=>`<div class="frais-item" onclick="if(confirm('Supprimer ce plein ?')){db.carburant=db.carburant.filter(x=>x.id!=='${c.id}');save();renderFin();}"><div><div style="font-weight:600">${new Date(c.date).toLocaleDateString('fr-BE',{day:'2-digit',month:'short'})}${c.station?' · '+c.station:''}</div><div style="font-size:0.73rem;color:var(--text3)">${c.litres||'?'} L · ${c.km?c.km+' km':''}</div></div><span style="font-weight:700;color:var(--orange2)">${fmt(c.prix)}</span></div>`).join(''):'<div class="empty" style="padding:20px"><div class="empty-text">Aucun plein ce mois</div></div>';

  const fraisIcons={entretien:'🔧',pneus:'🛞',controle:'📋',assurance:'🛡',lavage:'🚿',accessoires:'🧴',autre:'📦'};
  const fraisSorted=[...frais].sort((a,b)=>new Date(b.date)-new Date(a.date));
  document.getElementById('frais-list').innerHTML=fraisSorted.length?fraisSorted.map(f=>`<div class="frais-item"><div><div style="font-weight:600">${fraisIcons[f.type]||'📦'} ${f.desc||f.type}</div><div style="font-size:0.73rem;color:var(--text3)">${new Date(f.date).toLocaleDateString('fr-BE',{day:'2-digit',month:'short'})}${f.fournisseur?' · '+f.fournisseur:''}</div></div><div style="display:flex;align-items:center;gap:8px"><span style="font-weight:700;color:var(--red2)">${fmt(f.montant)}</span><button class="btn btn-outline btn-xs" onclick="openFraisModal('${f.id}')">✏️</button><button class="btn btn-red btn-xs" onclick="if(confirm('Supprimer ?')){db.frais=db.frais.filter(x=>x.id!=='${f.id}');save();renderFin();}">✕</button></div></div>`).join(''):'<div class="empty" style="padding:20px"><div class="empty-text">Aucun frais ce mois</div></div>';
}

function marquerCommissionPayee(p){if(!confirm(`Commissions de ${p} reversées ?`))return;db.reservations.forEach(r=>{if(r.source===p&&r.partnerType==='commission')r.commissionPayee=true;});save();renderAll();}

  document.getElementById('fav-list').innerHTML=db.favAddresses.length?db.favAddresses.map(f=>`<div class="sitem"><div class="sitem-left"><div class="sitem-label">📍 ${f.nom}</div><div class="sitem-sub">${f.adresse}</div></div><button class="btn btn-red btn-xs" onclick="db.favAddresses=db.favAddresses.filter(x=>x.id!=='${f.id}');save();renderParams();">✕</button></div>`).join(''):'';
  let cKm=0,chKm=0;const ch=db.charges.reduce((s,c)=>s+parseFloat(c.montant||0),0);
  let totKmR=0,totDR=0,mAvecR=0;
  for(let i=1;i<=3;i++){let m=curMonth-i,y=curYear;if(m<0){m+=12;y--;}const kmM=getKmReelsMois(m,y);const dM=getMonthCarb(m,y).reduce((s,c)=>s+parseFloat(c.prix||0),0);if(kmM&&kmM>0){totKmR+=kmM;totDR+=dM;mAvecR++;}}

  document.getElementById('p-calc-reel').textContent=(cKm+chKm)>0?(cKm+chKm).toFixed(3).replace('.',',')+' €/km':'—';
}

function getTotalSteps(){
  const type=document.getElementById('r-type')?.value||'aller';
  return type==='ar-diff'?6:5;
}

function getPanelForStep(step,type){
  if(type==='ar-diff'){
    const map={1:'sp1',2:'sp2',3:'sp3',4:'sp4',5:'sp5',6:'sp6'};
    return map[step];
  }else{
    // aller ou ar-jour: 5 étapes, skip sp3
    const map={1:'sp1',2:'sp2',3:'sp4',4:'sp5',5:'sp6'};
    return map[step];
  }
}

function getStepLabels(type){
  if(type==='ar-diff'){
    return['Client & source','Trajet aller','Trajet retour','Km à vide','Prix & paiement','Résumé & confirmation'];
  }
  return['Client & source','Trajet','Km à vide','Prix & paiement','Résumé & confirmation'];
}

function updResSteps(){
  // Cacher tous les panels
  document.querySelectorAll('.step-panel').forEach(p=>p.classList.remove('active'));
  const type=document.getElementById('r-type')?.value||'aller';
  const totalSteps=getTotalSteps();
  const labels=getStepLabels(type);
  const panelId=getPanelForStep(curStep,type);

  // Dots
  document.getElementById('res-steps').innerHTML=Array.from({length:totalSteps},(_,i)=>
    `<div class="step-dot ${i+1<curStep?'done':i+1===curStep?'active':''}"></div>`
  ).join('');

  // Label
  document.getElementById('res-step-label').textContent=
    `Étape ${curStep}/${totalSteps} — ${labels[curStep-1]||''}`;

  // Afficher le bon panel
  if(panelId){
    const panel=document.getElementById(panelId);
    if(panel)panel.classList.add('active');
  }

  // Boutons nav
  document.getElementById('res-btn-prev').style.display=curStep>1?'block':'none';
  const nb=document.getElementById('res-btn-next');
  const isLast=curStep===totalSteps;
  if(isLast){
    nb.textContent='✅ Enregistrer';
    nb.onclick=saveReservation;
    genResSummary();
  }else{
    nb.textContent='Suivant →';
    nb.onclick=()=>resStep(1);
  }
}

function resStep(dir){
  const type=document.getElementById('r-type').value;
  if(dir===1){
    // Validations par étape
    if(curStep===1&&!document.getElementById('r-client-nom').value.trim()){
      alert('Veuillez entrer le nom du client');return;
    }
    if(curStep===2){
      if(!document.getElementById('r-distance').value||parseFloat(document.getElementById('r-distance').value)<=0){
        alert('Veuillez entrer la distance aller');return;
      }
    }
    if(type==='ar-diff'&&curStep===3){
      const da=document.getElementById('r-date-aller').value;
      const dr=document.getElementById('r-date-retour').value;
      if(!dr){alert('Veuillez entrer la date de retour');return;}
      if(da&&dr&&new Date(dr)<=new Date(da)){alert('La date de retour doit être après la date d\'aller !');return;}
      if(!document.getElementById('r-distance-retour').value||parseFloat(document.getElementById('r-distance-retour').value)<=0){
        if(!confirm('Distance retour non calculée. Utiliser la même distance que l\'aller ?'))return;
        document.getElementById('r-distance-retour').value=document.getElementById('r-distance').value;
      }
    }
    // Étape prix
    const prixStep=type==='ar-diff'?5:4;
    if(curStep===prixStep){
      if(!document.getElementById('r-prix').value||parseFloat(document.getElementById('r-prix').value)<=0){
        alert('Veuillez entrer le prix');return;
      }
    }
  }
  const totalSteps=getTotalSteps();
  curStep=Math.max(1,Math.min(totalSteps,curStep+dir));
  updResSteps();
  // Calculer km à vide automatiquement quand on arrive sur step 4
  const videStep=type==='ar-diff'?4:3;
  if(curStep===videStep)calcKmVideAuto();
}

// Calcul km à vide automatique via OSRM
async function calcKmVideAuto(){
  const home=db.settings.homeAddress;
  if(!home?.lat)return;

  const typeAller=document.getElementById('r-vide-aller-type').value;
  const arrCoords=acCoords['r-arrivee'];
  const depCoords=acCoords['r-depart'];

  // Km retour vide J1
  if(typeAller!=='aucun'&&typeAller!=='manuel'){
    let fromCoords=null;
    let toCoords=null;
    if(typeAller==='maison'){fromCoords=arrCoords;toCoords={lat:home.lat,lon:home.lon};}
    else if(typeAller==='depart'){fromCoords=arrCoords;toCoords=depCoords;}
    if(fromCoords&&toCoords){
      try{
        const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${fromCoords.lon},${fromCoords.lat};${toCoords.lon},${toCoords.lat}?overview=false`);
        const d=await r.json();
        if(d.routes?.[0]){
          const km=parseFloat((d.routes[0].distance/1000).toFixed(1));
          acCoords['km-vide-aller-auto']=km;
          const el=document.getElementById('r-vide-aller-calc');
          if(el)el.textContent='→ '+km+' km (calculé automatiquement)';
          updKmRecap();
        }
      }catch(e){}
    }
  }else if(typeAller==='aucun'){
    acCoords['km-vide-aller-auto']=0;
    updKmRecap();
  }

  const type=document.getElementById('r-type').value;
  if(type==='ar-diff'){
    // Pickup retour J2: maison → lieu récupération
    const depRetCoords=acCoords['r-depart-retour'];
    if(depRetCoords){
      try{
        const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${home.lon},${home.lat};${depRetCoords.lon},${depRetCoords.lat}?overview=false`);
        const d=await r.json();
        if(d.routes?.[0]){
          const km=parseFloat((d.routes[0].distance/1000).toFixed(1));
          const el=document.getElementById('r-km-pickup-retour');if(el)el.value=km;
          const hint=document.getElementById('r-km-pickup-retour-hint');if(hint)hint.textContent='→ '+km+' km (Carnières → lieu récupération)';
          acCoords['km-pickup-retour-auto']=km;
          updKmRecap();
        }
      }catch(e){}
    }

    // Retour vide J2
    const typeRetour=document.getElementById('r-vide-retour-type').value;
    const arrRetCoords=acCoords['r-arrivee-retour'];
    if(typeRetour!=='aucun'&&typeRetour!=='manuel'){
      let fromCoords=null;let toCoords=null;
      if(typeRetour==='maison'){fromCoords=arrRetCoords;toCoords={lat:home.lat,lon:home.lon};}
      else if(typeRetour==='depart'){fromCoords=arrRetCoords;toCoords=depRetCoords||depCoords;}
      if(fromCoords&&toCoords){
        try{
          const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${fromCoords.lon},${fromCoords.lat};${toCoords.lon},${toCoords.lat}?overview=false`);
          const d=await r.json();
          if(d.routes?.[0]){
            const km=parseFloat((d.routes[0].distance/1000).toFixed(1));
            acCoords['km-vide-retour-auto']=km;
            const el=document.getElementById('r-vide-retour-calc');if(el)el.textContent='→ '+km+' km (calculé automatiquement)';
            updKmRecap();
          }
        }catch(e){}
      }
    }else if(typeRetour==='aucun'){
      acCoords['km-vide-retour-auto']=0;
      updKmRecap();
    }
  }else if(type==='ar-jour'){
    // AR jour: retour vide depuis arrivée vers maison
    const typeRetour=document.getElementById('r-vide-retour-type').value;
    if(typeRetour!=='aucun'&&typeRetour!=='manuel'&&arrCoords){
      let toCoords=typeRetour==='maison'?{lat:home.lat,lon:home.lon}:depCoords;
      if(toCoords){
        try{
          const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${arrCoords.lon},${arrCoords.lat};${toCoords.lon},${toCoords.lat}?overview=false`);
          const d=await r.json();
          if(d.routes?.[0]){
            const km=parseFloat((d.routes[0].distance/1000).toFixed(1));
            acCoords['km-vide-retour-auto']=km;
            const el=document.getElementById('r-vide-retour-calc');if(el)el.textContent='→ '+km+' km';
            updKmRecap();
          }
        }catch(e){}
      }
    }
  }
}

function updKmRecap(){
  const dist=parseFloat(document.getElementById('r-distance')?.value||0);
  const type=document.getElementById('r-type')?.value||'aller';
  const distRetJour=parseFloat(document.getElementById('r-distance-retour-jour')?.value||0);
  const distRet=parseFloat(document.getElementById('r-distance-retour')?.value||0);
  const kmPickup=parseFloat(document.getElementById('r-km-pickup')?.value||0);
  const kmPickupRet=parseFloat(document.getElementById('r-km-pickup-retour')?.value||acCoords['km-pickup-retour-auto']||0);
  const kmVideAller=getKmVideAllerVal();
  const kmVideRetour=getKmVideRetourVal();

  let kmClient=dist;
  if(type==='ar-jour')kmClient+=distRetJour||dist;
  else if(type==='ar-diff')kmClient+=distRet||dist;

  let kmReels=kmPickup+dist+kmVideAller;
  if(type==='ar-jour')kmReels+=(distRetJour||dist)+kmVideRetour;
  else if(type==='ar-diff')kmReels+=kmPickupRet+(distRet||dist)+kmVideRetour;

  const setEl=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};
  setEl('kr-pickup',kmPickup>0?fmtKm(kmPickup):'—');
  setEl('kr-aller',dist>0?fmtKm(dist):'—');
  setEl('kr-vide1',kmVideAller>0?fmtKm(kmVideAller):'—');
  setEl('kr-pickup2',kmPickupRet>0?fmtKm(kmPickupRet):'—');
  setEl('kr-retour',(distRet||distRetJour)>0?fmtKm(distRet||distRetJour):'—');
  setEl('kr-vide2',kmVideRetour>0?fmtKm(kmVideRetour):'—');
  setEl('kr-total',kmReels>0?fmtKm(kmReels):'—');
  setEl('kr-client',kmClient>0?fmtKm(kmClient):'—');

  acCoords['km-client-calc']=kmClient;
  acCoords['km-reels-calc']=kmReels;
  updCalc();
}

function updCalc(){
  const dist=parseFloat(document.getElementById('r-distance')?.value||0);
  const type=document.getElementById('r-type')?.value||'aller';
  const prix=parseFloat(document.getElementById('r-prix')?.value||0);
  const peages=parseFloat(document.getElementById('r-peages')?.value||0);
  const park=parseFloat(document.getElementById('r-parking')?.value||0);
  const comm=parseFloat(document.getElementById('r-commission')?.value||0);
  const vidx=parseInt(document.getElementById('r-vehicule')?.value||0);
  const v=getV(vidx);
  const kmClient=acCoords['km-client-calc']||0;
  const kmReels=acCoords['km-reels-calc']||0;
  const coutClient=kmClient*v.cout;
  const coutReel=kmReels*v.cout;
  const benef=prix-coutClient-peages-park-comm;
  const benefReel=prix-coutReel-peages-park-comm;

  const setEl=(id,val,cls)=>{const el=document.getElementById(id);if(el){el.textContent=val;if(cls!==undefined)el.className=cls;}};
  setEl('prev-km-client',fmtKm(kmClient));
  setEl('prev-km-reels',fmtKm(kmReels));
  setEl('prev-cout',fmt(coutClient));
  setEl('prev-benef',fmt(benef),'dr-val '+(benef>=0?'c-green':'c-red'));
  setEl('prev-benef-reel','Bénéf. réel: '+fmt(benefReel));
  const brEl=document.getElementById('prev-benef-reel');
  if(brEl)brEl.style.color=benefReel>=0?'var(--green2)':'var(--red2)';

  const commRow=document.getElementById('prev-comm-row');
  if(commRow){
    if(comm>0){commRow.style.display='flex';setEl('prev-comm','-'+fmt(comm));}
    else commRow.style.display='none';
  }

  const hintEl=document.getElementById('r-prix-hint');
  if(hintEl){
    if(prix>0&&benef<0)hintEl.textContent='⚠️ Prix sous le coût — vous perdez '+fmt(Math.abs(benef));
    else hintEl.textContent='';
  }

  // Prix suggéré — basé sur distance trajet vs rayon
  if(dist>0){
    const t=db.settings.tarifs;
    const tarifApply=dist>t.rayon?t.long:t.court;
    const isTalento=vidx===1;
    const distRetour=type==='ar-diff'?parseFloat(document.getElementById('r-distance-retour')?.value||dist):(type==='ar-jour'?parseFloat(document.getElementById('r-distance-retour-jour')?.value||dist):0);
    let prixBase=(dist+distRetour)*tarifApply;
    if(isTalento)prixBase+=t.camion;
    prixBase=Math.max(t.min,prixBase);
    const nomClient=document.getElementById('r-client-nom')?.value.trim()||'';
    const vipApply=nomClient&&isVip(nomClient);
    let prixSug=roundTo(prixBase,t.round);
    if(vipApply)prixSug=roundTo(prixSug*(1-db.settings.vip.reduc/100),t.round);
    const box=document.getElementById('r-devis-box');if(box)box.style.display='block';
    setEl('r-devis-price',prixSug+' €');
    const vipNote=vipApply?` · VIP -${db.settings.vip.reduc}%`:'';
    setEl('r-devis-detail',`${dist}km × ${tarifApply.toFixed(2)}€/km${distRetour>0?' + '+distRetour+'km retour':''}${isTalento?' +'+t.camion+'€':''}${vipNote} · Arrondi ${t.round}€`);
    acCoords['devis-prix']=prixSug;
  }
}

function updAcompte(){
  const prix=parseFloat(document.getElementById('r-prix')?.value||0);
  const acompte=parseFloat(document.getElementById('r-acompte')?.value||0);
  const type=document.getElementById('r-type')?.value||'aller';
  const hint=document.getElementById('r-solde-hint');
  if(!hint)return;

  const nomClient=document.getElementById('r-client-nom').value.trim();

  const r={

    vehicule:vidx,passagers:document.getElementById('r-passagers').value,

    commission:source!=='direct'&&partnerType==='commission'?parseFloat(document.getElementById('r-commission')?.value||0):0,

    dateRetour:type==='ar-diff'?document.getElementById('r-date-retour').value:'',
    heureRetour:type==='ar-diff'?document.getElementById('r-heure-retour').value:(document.getElementById('r-heure-retour-jour')?.value||''),
    depart:document.getElementById('r-depart').value,
    arrivee:document.getElementById('r-arrivee').value,
    distance:document.getElementById('r-distance').value,
    distanceRetour:distRet,
    departRetour:type==='ar-diff'?document.getElementById('r-depart-retour').value:'',
    arriveeRetour:type==='ar-diff'?document.getElementById('r-arrivee-retour').value:'',
    depRetLat:type==='ar-diff'?parseFloat(document.getElementById('r-dep-ret-lat')?.value||0)||null:null,
    depRetLon:type==='ar-diff'?parseFloat(document.getElementById('r-dep-ret-lon')?.value||0)||null:null,
    arrRetLat:type==='ar-diff'?parseFloat(document.getElementById('r-arr-ret-lat')?.value||0)||null:null,
    arrRetLon:type==='ar-diff'?parseFloat(document.getElementById('r-arr-ret-lon')?.value||0)||null:null,
    kmPickup:parseFloat(document.getElementById('r-km-pickup')?.value||0),
    kmPickupRetour:kmPickupRet,
    kmVideAller,kmVideAllerType:document.getElementById('r-vide-aller-type')?.value||'maison',
    kmVideRetour,kmVideRetourType:document.getElementById('r-vide-retour-type')?.value||'maison',
    vol:document.getElementById('r-vol').value.toUpperCase(),
    prix:document.getElementById('r-prix').value,
    paiement:document.getElementById('r-paiement').value,
    vmtRecu:document.getElementById('r-vmt-recu').checked,
    peages:document.getElementById('r-peages').value,
    parking:document.getElementById('r-parking').value,
    acompte:parseFloat(document.getElementById('r-acompte')?.value||0),
    notes:document.getElementById('r-notes').value,

  };

  const editId=document.getElementById('res-edit-id').value;
  if(editId){const i=db.reservations.findIndex(x=>x.id===editId);if(i!==-1)db.reservations[i]=r;}

    const distEl=document.getElementById('r-distance-retour');if(distEl)distEl.value=r.distanceRetour||'';

  }else if(r.type==='ar-jour'){

  }

  if(r.type==='ar-jour'||r.type==='ar-diff')kmC+=parseFloat(r.distanceRetour||r.distance||0);
  let kmR=parseFloat(r.kmPickup||0)+parseFloat(r.distance||0)+parseFloat(r.kmVideAller||0);
  if(r.type==='ar-diff')kmR+=parseFloat(r.kmPickupRetour||0)+parseFloat(r.distanceRetour||r.distance||0)+parseFloat(r.kmVideRetour||0);
  else if(r.type==='ar-jour')kmR+=parseFloat(r.distanceRetour||r.distance||0)+parseFloat(r.kmVideRetour||0);
  acCoords['km-client-calc']=kmC;acCoords['km-reels-calc']=kmR;
  curStep=1;updResSteps();openModal('m-res');
}

async function acSearch(input,dropId,role){
  const q=input.value.trim();const drop=document.getElementById(dropId);
  clearTimeout(acTimers[role]);
  if(q.length<3){drop.style.display='none';return;}
  acTimers[role]=setTimeout(async()=>{
    try{
      const url=`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=5&lang=fr&bbox=2.3,49.4,6.5,51.5`;
      const resp=await fetch(url);const data=await resp.json();
      const results=data.features||[];
      if(!results.length){drop.style.display='none';return;}
      drop.innerHTML=results.map(r=>{
        const p=r.properties;const coords=r.geometry.coordinates;
        const main=[p.name,p.street?(p.housenumber?p.street+' '+p.housenumber:p.street):null].filter(Boolean).join(', ')||p.name||'';
        const city=p.city||p.town||p.village||'';const country=p.country||'';
        const full=[main,city,country].filter(Boolean).join(', ');
        const safe=full.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        return`<div class="ac-item" onclick="acSel('${role}','${safe}',${coords[1]},${coords[0]})"><div class="ac-main">${main||city}</div>${city?`<div class="ac-sub">${city}, ${country}</div>`:''}</div>`;
      }).join('');
      drop.style.display='block';
    }catch(e){drop.style.display='none';}
  },350);
}

function acSel(role,display,lat,lon){
  acCoords[role]={lat:parseFloat(lat),lon:parseFloat(lon)};
  const map={
    'r-depart':['r-depart','r-dep-lat','r-dep-lon','ac-r-dep'],
    'r-arrivee':['r-arrivee','r-arr-lat','r-arr-lon','ac-r-arr'],
    'r-depart-retour':['r-depart-retour','r-dep-ret-lat','r-dep-ret-lon','ac-r-dep-ret'],
    'r-arrivee-retour':['r-arrivee-retour','r-arr-ret-lat','r-arr-ret-lon','ac-r-arr-ret'],
    'c-adresse':['c-adresse','c-lat','c-lon','ac-c-adr'],
    'home':['home-adr','home-lat','home-lon','ac-home'],
    'fav-addr':['fav-adresse','fav-lat','fav-lon','ac-fav']
  };
  const m=map[role];
  if(m){
    const el0=document.getElementById(m[0]);if(el0)el0.value=display;
    const el1=document.getElementById(m[1]);if(el1)el1.value=lat;
    const el2=document.getElementById(m[2]);if(el2)el2.value=lon;
    const el3=document.getElementById(m[3]);if(el3)el3.style.display='none';
  }
  if(role==='r-depart'||role==='r-arrivee'){if(acCoords['r-depart']&&acCoords['r-arrivee'])calcDist();}
  if(role==='r-depart-retour'||role==='r-arrivee-retour'){if(acCoords['r-depart-retour']&&acCoords['r-arrivee-retour'])calcDistRetour();}
  setTimeout(()=>calcKmVideAuto(),500);
}

async function calcDist(){
  const dep=acCoords['r-depart'],arr=acCoords['r-arrivee'];
  if(!dep||!arr)return;
  document.getElementById('dist-loading').style.display='flex';
  document.getElementById('dist-ok').style.display='none';
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${dep.lon},${dep.lat};${arr.lon},${arr.lat}?overview=false`);
    const d=await r.json();
    document.getElementById('dist-loading').style.display='none';
    if(d.routes&&d.routes[0]){
      const km=(d.routes[0].distance/1000).toFixed(1);
      const mins=Math.round(d.routes[0].duration/60);
      const h=Math.floor(mins/60),m=mins%60;
      document.getElementById('r-distance').value=km;
      document.getElementById('dist-km').textContent=km+' km';
      document.getElementById('dist-time').textContent='⏱ '+(h>0?`${h}h${m<10?'0':''}${m}`:`${m} min`);
      document.getElementById('dist-ok').style.display='flex';
      updKmRecap();
      setTimeout(()=>calcKmVideAuto(),200);
    }
  }catch(e){document.getElementById('dist-loading').style.display='none';}
}

async function calcDistRetour(){
  const dep=acCoords['r-depart-retour'],arr=acCoords['r-arrivee-retour'];
  if(!dep||!arr)return;
  const loadEl=document.getElementById('dist-ret-loading');if(loadEl)loadEl.style.display='flex';
  const okEl=document.getElementById('dist-ret-ok');if(okEl)okEl.style.display='none';
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${dep.lon},${dep.lat};${arr.lon},${arr.lat}?overview=false`);
    const d=await r.json();
    if(loadEl)loadEl.style.display='none';
    if(d.routes&&d.routes[0]){
      const km=(d.routes[0].distance/1000).toFixed(1);
      const mins=Math.round(d.routes[0].duration/60);
      const h=Math.floor(mins/60),m=mins%60;
      const distEl=document.getElementById('r-distance-retour');if(distEl)distEl.value=km;
      const kmEl=document.getElementById('dist-ret-km');if(kmEl)kmEl.textContent=km+' km';
      const timeEl=document.getElementById('dist-ret-time');if(timeEl)timeEl.textContent='⏱ '+(h>0?`${h}h${m<10?'0':''}${m}`:`${m} min`);
      if(okEl)okEl.style.display='flex';
      updKmRecap();
      setTimeout(()=>calcKmVideAuto(),200);
    }
  }catch(e){if(loadEl)loadEl.style.display='none';}
}

// ===== ICS =====
function exportICS(r){
  const fmtDT=(ds,hs)=>{if(!ds)return'';const d=new Date(ds+'T'+(hs||'08:00')+':00');return d.getFullYear().toString()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';};
  const start=fmtDT(r.dateAller,r.heure);
  const duree=parseInt(r.duree)||90;
  const dEnd=new Date(r.dateAller+'T'+(r.heure||'08:00')+':00');
  dEnd.setMinutes(dEnd.getMinutes()+duree);
  const end=dEnd.getFullYear().toString()+String(dEnd.getMonth()+1).padStart(2,'0')+String(dEnd.getDate()).padStart(2,'0')+'T'+String(dEnd.getHours()).padStart(2,'0')+String(dEnd.getMinutes()).padStart(2,'0')+'00';
  const esc=s=>String(s||'').replace(/[\\,;]/g,' ').replace(/\n/g,'\\n');
  const desc=esc(`${r.clientNom} · ${r.depart} → ${r.arrivee} · ${fmt(r.prix)}${r.vol?' · Vol: '+r.vol:''}${r.clientTel?' · '+r.clientTel:''}`);
  const ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Facciolini Mobility//FR\r\nBEGIN:VEVENT\r\nUID:fm-${r.id}@facciolini\r\nSUMMARY:✈ ${r.heure||''} ${(r.arrivee||'').split(',')[0]||'Course'} - ${r.clientNom}\r\nDESCRIPTION:${desc}\r\nDTSTART:${start}\r\nDTEND:${end}\r\nLOCATION:${esc(r.depart)}\r\nEND:VEVENT\r\nEND:VCALENDAR`;
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`course_${r.dateAller}_${r.clientNom||'course'}.ics`;a.click();
}

// ===== EXPORT =====
function genNoteFrais(){
  const res=getMonthRes(curMonth,curYear);const carbs=getMonthCarb(curMonth,curYear);const frais=getMonthFrais(curMonth,curYear);
  const recettes=res.reduce((s,r)=>s+parseFloat(r.prix||0),0);
  const encaisse=getEncaisseMois(curMonth,curYear);
  const totalKmClient=res.reduce((s,r)=>s+getKmClient(r),0);
  const totalKmReels=res.reduce((s,r)=>s+getKmReels(r),0);
  const charges=db.charges.reduce((s,c)=>s+parseFloat(c.montant||0),0);
  const diesel=carbs.reduce((s,c)=>s+parseFloat(c.prix||0),0);
  const fraisTotal=frais.reduce((s,f)=>s+parseFloat(f.montant||0),0);
  const peages=res.reduce((s,r)=>s+parseFloat(r.peages||0),0);
  const parkings=res.reduce((s,r)=>s+parseFloat(r.parking||0),0);
  const commissions=res.reduce((s,r)=>s+parseFloat(r.commission||0),0);
  const benef=res.reduce((s,r)=>s+getBenef(r),0)-charges-diesel-fraisTotal;
  const benefReel=res.reduce((s,r)=>s+getBenefReel(r),0)-charges-diesel-fraisTotal;
  const kmReel=getKmReelsMois(curMonth,curYear);
  const fraisIcons={entretien:'🔧',pneus:'🛞',controle:'📋',assurance:'🛡',lavage:'🚿',accessoires:'🧴',autre:'📦'};
  document.getElementById('nf-title').textContent='Note de frais — '+MOIS[curMonth]+' '+curYear;
  document.getElementById('nf-content').innerHTML=`
    <div style="background:var(--bg3);border-radius:var(--radius-sm);padding:12px;margin-bottom:14px;font-size:0.73rem;color:var(--text2);line-height:1.7">${MOI.nom} · BCE ${MOI.bce}<br>${MOI.adresse}<br>${MOI.email} · ${MOI.tel}</div>
    <div class="dr"><span class="dr-label">Facturé</span><span class="dr-val c-gold">${fmt(recettes)}</span></div>
    <div class="dr"><span class="dr-label">Encaissé ce mois</span><span class="dr-val c-green">${fmt(encaisse)}</span></div>
    <div class="dr"><span class="dr-label">Courses</span><span class="dr-val">${res.length}</span></div>
    <div class="dr"><span class="dr-label">Km clients facturés</span><span class="dr-val c-blue">${fmtKm(totalKmClient)}</span></div>
    <div class="dr"><span class="dr-label">Km réels totaux</span><span class="dr-val c-purple">${kmReel?Math.round(kmReel)+' km (compteur)':fmtKm(totalKmReels)+' (estimé)'}</span></div>
    <div class="dr"><span class="dr-label">Km annuels</span><span class="dr-val">${fmtKm(getYearKm(curYear))}</span></div>
    <div class="divider"></div>
    <div class="dr"><span class="dr-label">Carburant</span><span class="dr-val c-red">- ${fmt(diesel)}</span></div>
    <div class="dr"><span class="dr-label">Péages</span><span class="dr-val c-red">- ${fmt(peages)}</span></div>
    <div class="dr"><span class="dr-label">Parkings</span><span class="dr-val c-red">- ${fmt(parkings)}</span></div>
    <div class="dr"><span class="dr-label">Commissions</span><span class="dr-val c-red">- ${fmt(commissions)}</span></div>
    <div class="dr"><span class="dr-label">Frais exceptionnels</span><span class="dr-val c-red">- ${fmt(fraisTotal)}</span></div>
    ${frais.map(f=>`<div class="dr" style="padding-left:12px"><span class="dr-label" style="font-size:0.72rem">${fraisIcons[f.type]||'📦'} ${f.desc||f.type}${f.fournisseur?' · '+f.fournisseur:''}</span><span class="dr-val" style="font-size:0.72rem">- ${fmt(f.montant)}</span></div>`).join('')}
    <div class="dr"><span class="dr-label">Charges fixes</span><span class="dr-val c-red">- ${fmt(charges)}</span></div>
    ${db.charges.map(c=>`<div class="dr" style="padding-left:12px"><span class="dr-label" style="font-size:0.72rem">· ${c.nom}</span><span class="dr-val" style="font-size:0.72rem">- ${fmt(c.montant)}</span></div>`).join('')}
    <div class="divider"></div>
    <div class="dr" style="background:var(--bg3);border-radius:var(--radius-xs);padding:12px"><span class="dr-label" style="font-weight:700;color:var(--text);font-size:0.95rem">BÉNÉFICE COMPTABLE</span><span class="dr-val ${benef>=0?'c-green':'c-red'}" style="font-size:1.2rem;font-family:'Playfair Display',serif">${fmt(benef)}</span></div>
    <div class="dr" style="padding:10px 0"><span class="dr-label" style="color:var(--text2)">Bénéfice réel (km réels)</span><span class="dr-val ${benefReel>=0?'c-green':'c-red'}">${fmt(benefReel)}</span></div>
    <div class="divider"></div>
    <div style="font-size:0.65rem;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px">Détail des courses</div>
    ${res.map(r=>{const kmC=getKmClient(r);const kmR=getKmReels(r);return`<div class="dr"><span class="dr-label">${new Date(r.dateAller).toLocaleDateString('fr-BE',{day:'2-digit',month:'short'})} · ${r.clientNom||'—'}<br><span style="font-size:0.7rem;color:var(--text3)">${(r.depart||'').substring(0,16)}→${(r.arrivee||'').substring(0,16)} · ${fmtKm(kmC)} / ${fmtKm(kmR)} réels${r.source!=='direct'?' · '+r.source:''}</span></span><span class="dr-val">${fmt(r.prix)}${parseFloat(r.commission||0)>0?`<br><span style="font-size:0.68rem;color:var(--red2)">comm.-${fmt(r.commission)}</span>`:''}</span></div>`;}).join('')}`;
  openModal('m-note-frais');
}

function exportNoteCSV(){
  const res=getMonthRes(curMonth,curYear);
  const frais=getMonthFrais(curMonth,curYear);
  let csv='Date;Client;Tel;Source;Commission;Départ;Arrivée;Départ_Retour;Arrivée_Retour;Type;Km_Client;Km_Réels;Prix;Péages;Parking;Bénéfice_Comptable;Bénéfice_Réel\n';
  res.forEach(r=>{
    csv+=[
      new Date(r.dateAller).toLocaleDateString('fr-BE'),r.clientNom||'',r.clientTel||'',
      r.source||'direct',r.commission||0,r.depart,r.arrivee,
      r.departRetour||'',r.arriveeRetour||'',r.type,
      getKmClient(r).toFixed(1),getKmReels(r).toFixed(1),
      r.prix,r.peages||0,r.parking||0,getBenef(r).toFixed(2),getBenefReel(r).toFixed(2)
    ].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(';')+'\n';
  });
  if(frais.length){
    csv+='\nFRAIS EXCEPTIONNELS\nDate;Catégorie;Description;Fournisseur;Montant\n';
    frais.forEach(f=>{
      csv+=[new Date(f.date).toLocaleDateString('fr-BE'),f.type,f.desc||'',f.fournisseur||'',f.montant].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(';')+'\n';
    });
  }
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`facciolini_${MOIS[curMonth]}_${curYear}.csv`;a.click();
}

function exportCSV(){genNoteFrais();setTimeout(exportNoteCSV,500);}
function exportBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`facciolini_backup_v52_${new Date().toISOString().split('T')[0]}.json`;a.click();}
function doImport(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=evt=>{try{const d=JSON.parse(evt.target.result);if(d.reservations||d.charges){if(confirm('Restaurer ces données ?')){db={...db,...d};fixDb();save();renderAll();alert('✅ Données restaurées !');}}else alert('Fichier invalide');}catch(err){alert('Erreur: '+err.message);}};reader.readAsText(file);e.target.value='';}

// ===== CHIPS =====
function selectChip(el,hiddenId,val){const c=el.closest('.chips');if(!c)return;c.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');const h=document.getElementById(hiddenId);if(h)h.value=val;}
function setChips(contId,hiddenId,val){const c=document.getElementById(contId);if(!c)return;c.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',(x.getAttribute('onclick')||'').includes("'"+val+"'")));const h=document.getElementById(hiddenId);if(h)h.value=val;}

// ===== INIT =====
load();
if(!db.settings.pin)unlockApp();
</script>
